<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在青瓦郡四处游历，和灭霸一起查田契、修灵脉、斗法器。">
  <meta name="theme-color" content="#253e33">
  <title>青瓦郡 · 爱慕杰修仙志</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="atlas.css">
  <link rel="stylesheet" href="character.css?v=battle-motion">
  <link rel="stylesheet" href="dialogue.css">
  <link rel="stylesheet" href="exploration.css">
  <script src="encounters.js" defer></script>
  <script src="water-case.js" defer></script>
  <script src="first-rain.js" defer></script>
  <script src="world.js" defer></script>
  <script src="quests.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <header class="binding">
    <div class="binding-inner">
      <div class="wordmark"><span class="book-seal" aria-hidden="true">郡</span>爱慕杰修仙志</div>
      <nav aria-label="行旅手册">
        <button type="button" id="nav-character" aria-haspopup="dialog">人物</button>
        <button type="button" id="nav-bag" aria-haspopup="dialog" aria-keyshortcuts="B">背包 <kbd>B</kbd></button>
        <button type="button" id="nav-journal" aria-haspopup="dialog" aria-keyshortcuts="J">郡中纪事 <kbd>J</kbd></button>
        <button type="button" id="nav-clear" aria-haspopup="dialog" aria-keyshortcuts="Shift+Delete" title="清除当前存档（Shift + Delete）">清除存档</button>
      </nav>
    </div>
  </header>
  <noscript><p class="noscript">请启用 JavaScript 以开启游历。</p></noscript>
  <main class="atlas-shell" id="atlas-view">
    <header class="atlas-header">
      <div>
        <h1>青瓦郡山河图</h1>
        <p id="world-premise">天门闭了三十年。仙盟重划灵脉，灭家的田要在第五日交割。</p>
      </div>
      <div class="almanac"><span>郡历</span><strong id="day">第 1 日</strong></div>
    </header>
    <section class="atlas-dispatch" aria-label="追踪任务">
      <div class="quest-heading"><span class="field-label">追踪任务</span><span id="quest-deadline"></span></div>
      <button id="atlas-dispatch" type="button" aria-haspopup="dialog"><strong id="dispatch-text"></strong><span aria-hidden="true"> ›</span></button>
      <button id="quest-locate" type="button"></button>
    </section>
    <div class="field-layout">
      <div class="map-column">
        <figure class="atlas-figure">
          <div class="atlas-map" id="atlas-map" role="group" aria-label="点选地名可查看行程或前往">
            <img class="map-art" src="art/locations/qingwa-atlas.webp" alt="青瓦河从群山间流过，西岸有村田和市镇，东岸有学宫和废弃的水闸。" width="1536" height="1024">
            <span id="route-trail" aria-hidden="true" hidden></span>
            <span id="traveler" aria-hidden="true"><span class="hero-avatar" data-hero-art></span></span>
            <span id="route-note" hidden></span>
          </div>
          <figcaption>
            <span class="map-traveler"><span class="hero-avatar" data-hero-art aria-hidden="true"></span><span id="map-position">灭霸在灭家村</span></span>
            <span id="travel-hint">点地名探路 · 赶路耗一日</span>
          </figcaption>
        </figure>
        <article id="water-notice" class="water-notice" aria-labelledby="water-title" hidden>
          <img id="hearing-art" alt="田边的听证桌上摆着锯了缺口的量斗、算盘和拆下的表齿。" width="600" height="360">
          <div>
            <div class="letter-title"><span class="field-label" id="water-status"></span><span id="water-date"></span></div>
            <h2 id="water-title"></h2>
            <p id="water-copy"></p>
          </div>
        </article>
        <section class="deed-sheet" id="rain-notice" aria-labelledby="rain-title" hidden>
          <div class="letter-title"><span class="field-label">汛情</span><span id="rain-status"></span></div>
          <h2 id="rain-title">青瓦郡的第一场大雨</h2>
          <p id="rain-copy"></p>
        </section>
        <section class="deed-sheet" aria-labelledby="deed-title">
          <div class="letter-title"><span class="field-label">郡中告示</span><span id="deed-state"></span></div>
          <h2 id="deed-title">第五天，谁家的田？</h2>
          <p id="deed-copy"></p>
        </section>
      </div>
      <section class="local-sheet" id="local-sheet" aria-labelledby="place-name">
        <div class="local-head"><span class="field-label" id="place-context"></span><span id="place-tag"></span></div>
        <h2 id="place-name" tabindex="-1">灭家村</h2>
        <p id="place-lore"></p>
        <p class="visitors" id="visitors"></p>
        <details id="water-voices" hidden>
          <summary>听听水案各方怎么说</summary>
          <dl id="voice-lines"></dl>
          <div class="hero-reply">
            <span class="hero-avatar" id="hearing-face" data-hero-art aria-hidden="true"></span>
            <p><strong>灭霸</strong><span id="hearing-reply"></span></p>
          </div>
        </details>
        <div class="latest" id="latest" tabindex="-1"></div>
        <p class="starter-tip" id="field-tip" hidden><strong>游历提示</strong> <span id="field-tip-copy"></span></p>
        <div id="local-actions" class="local-actions"></div>
      </section>
    </div>
    <footer class="atlas-footer"><span id="identity"></span><span id="save-status"></span></footer>
    <button class="explorer-card" type="button" id="explorer-card" aria-haspopup="dialog" title="查看人物属性">
      <span class="hero-avatar" data-hero-art aria-hidden="true"></span>
      <span class="explorer-info"><span><strong>灭霸</strong> <span id="hud-realm"></span></span>
        <span id="hud-cultivation"></span><span id="hud-vitals"></span><span id="hud-gear"></span>
      </span>
    </button>

  </main>
  <main class="game" id="battle-view" hidden>
    <header class="case-header">
      <p class="masthead"><button type="button" id="leave-battle">← 回山河图</button><span id="battle-place"></span></p>
      <h1 id="case-title" tabindex="-1"></h1>
      <p class="premise" id="case-premise"></p>
    </header>

    <div class="battle" id="battle">
      <div class="vitals" role="group" aria-label="对战双方">
        <section class="vital ally" aria-labelledby="player-name">
          <div class="vital-heading"><h2 id="player-name">灭霸</h2><span id="battle-realm"></span></div>
          <p class="vital-value">体力 <strong id="health-value"></strong> / <span id="health-max"></span></p>
          <div class="meter health-meter" id="health-meter" aria-hidden="true"><span class="filled"></span></div>
        </section>
        <section class="vital enemy" aria-labelledby="enemy-name">
          <div class="vital-heading"><h2 id="enemy-name"></h2></div>
          <p class="vital-value"><span id="enemy-meter-label">架势</span> <strong id="armor-value"></strong> / <span id="armor-max"></span></p>
          <div class="meter armor-meter" id="armor-meter" aria-hidden="true"><span class="filled"></span></div>
        </section>
      </div>

      <div class="arena-art" id="arena-art" role="img" aria-label="灭霸与对手对阵">
        <div class="player-fighter"><div class="hero-stage" data-hero-art aria-hidden="true"><span class="snap-mark">啪</span></div></div>
        <img class="furnace" id="furnace-art" loading="lazy" src="art/concepts/attendance-furnace.png" width="1254" height="1254" alt="">
        <span class="furnace-effect" aria-hidden="true"></span>
        <span class="hammer-light" aria-hidden="true"></span>
        <span class="battle-impact" id="battle-impact" aria-hidden="true"></span>
      </div>

      <section class="dispatch" aria-label="选择战斗指令">
        <div class="announcement" id="announcement" data-tone="neutral">
          <div class="announcement-heading"><span class="announcement-label" id="announcement-label"></span><h2 id="announcement-title"></h2></div>
          <p id="announcement-description"></p>
        </div>
        <div class="command-heading"><h2>指令</h2><span id="round-number"></span><p>灵力 <strong id="spirit-value"></strong> / <span id="spirit-max"></span></p><button type="button" id="skip-battle" class="text-button" hidden>跳过动画</button></div>
        <p class="starter-tip" id="duel-tip" hidden><strong>切磋提示</strong> <span id="duel-tip-copy"></span></p>
        <div class="commands" id="commands"></div>
        <p id="battle-reply" class="battle-reply"></p>
        <p id="duel-result" hidden></p>
        <details class="match-details" id="duel-details" hidden><summary>查看双方属性</summary><p id="duel-attributes"></p></details>
      </section>
    </div>

    <section class="history" aria-labelledby="history-heading">
      <h2 id="history-heading">战斗记录</h2>
      <ol class="history-list" id="history-list" reversed></ol>
    </section>
  </main>
  <dialog id="ledger" aria-labelledby="ledger-title">
    <header class="ledger-head"><h2 id="ledger-title" tabindex="-1"></h2><button id="close-ledger" type="button">合上</button></header>
    <div id="ledger-content"></div>
    <p id="ledger-feedback" class="screen-reader" role="status"></p>
  </dialog>
  <dialog id="story-dialog" aria-labelledby="story-title">
    <header class="story-head">
      <h2 id="story-title" tabindex="-1">祠堂檐下</h2>
      <button type="button" id="story-close">合上</button>
    </header>
    <div class="story-cast" aria-hidden="true">
      <figure class="story-portrait" id="story-hero">
        <img id="story-hero-photo" alt="">
        <figcaption>灭霸</figcaption>
      </figure>
      <figure class="story-portrait" id="story-partner">
        <img id="story-partner-photo" alt="">
        <figcaption id="story-partner-name"></figcaption>
      </figure>
    </div>
    <div class="story-paper">
      <div class="story-line" aria-live="polite" aria-atomic="true">
        <strong id="story-speaker"></strong>
        <p id="story-text"></p>
      </div>
      <div id="story-choices" class="story-choices" aria-label="决定先去哪里" hidden></div>
      <footer class="story-controls">
        <button type="button" id="story-prev">上一句</button>
        <button type="button" id="story-next">继续 <span aria-hidden="true">→</span></button>
      </footer>
    </div>
  </dialog>
  <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-warning">
    <h2 id="reset-title">清除当前存档？</h2>
    <p id="reset-warning"></p>
    <p id="reset-error" role="alert" hidden></p>
    <div class="reset-actions">
      <button type="button" id="reset-cancel" autofocus>保留存档</button>
      <button type="button" id="reset-confirm">确认清除</button>
    </div>
  </dialog>
  <template id="hero-art">
    <span class="hero-portrait">
      <img class="hero-photo hero-stern" src="art/characters/thanos-campus-stern.png" width="578" height="444" alt="">
      <img class="hero-photo hero-laugh" src="art/characters/thanos-campus-laugh.png" width="682" height="722" alt="">
    </span>
  </template>
  <p class="screen-reader" id="update" role="status" aria-atomic="true"></p>
</body>
</html>
